<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEP Miner Cluster</title></head><body><h1>PEP Miner Cluster</h1><p>Painel multiworker. Motor de mineração ainda não implementado; nenhum hashrate ou share é simulado.</p><input id="token" type="password" placeholder="Token do painel"><button id="go">Conectar</button><pre id="out">Aguardando.</pre><script>document.getElementById('go').onclick=async()=>{const r=await fetch('/api/workers',{headers:{'X-Cluster-Token':document.getElementById('token').value}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
